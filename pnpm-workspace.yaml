# `allowBuilds` n'existe que depuis pnpm 10.26 ; `packageManager` épingle
# 10.15, qui lit encore onlyBuiltDependencies / ignoredBuiltDependencies.
# Les deux formes expriment la même décision : Prisma et sharp compilent,
# unrs-resolver non — et ce refus est délibéré, pas un oubli d'approbation.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: false
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - sharp
ignoredBuiltDependencies:
  - unrs-resolver
overrides:
  deepmerge-ts: 8.0.0
  effect: 3.20.0
  electron-to-chromium: 1.5.430
