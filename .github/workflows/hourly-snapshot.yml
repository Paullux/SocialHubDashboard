name: Hourly Snapshot

# ⚠️ Cron désactivé : le snapshot horaire est maintenant piloté par le crontab
# du VPS (Coolify) qui ping https://social-hub.fr/api/cron/snapshot.
# On garde ce workflow en secours, lançable à la main (workflow_dispatch).
# Pour réactiver le cron auto : décommenter le bloc "schedule" ci-dessous.
on:
  # schedule:
  #   - cron: "12 * * * *"
  #   - cron: "42 * * * *"
  workflow_dispatch: {}

jobs:
  call-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Hit snapshot endpoint
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Calling $BASE_URL/api/cron/snapshot"
          curl -sS --fail-with-body "${BASE_URL}/api/cron/snapshot?key=${CRON_SECRET}" \
            --max-time 90 \
            -H "User-Agent: github-actions-cron"
